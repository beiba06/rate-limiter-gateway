services:
  redis:
    image: redis:8.10-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    image: traefik/whoami:v1.12.0
    ports:
      - "127.0.0.1:9001:80"

  gateway:
    build: .
    depends_on: [redis, backend]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"

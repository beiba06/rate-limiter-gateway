# Used by `go run . --config config.yaml`, with Redis and the backend on localhost.
listen: ":8080"
admin_listen: "127.0.0.1:9090" # /metrics and /admin/algorithm. Never expose publicly.
redis_addr: "localhost:6379"
algorithm: token_bucket # token_bucket | sliding_window | fixed_window

routes:
  - prefix: /api/
    backend: http://localhost:9001

# limit requests per window. Requests with a key not listed here get a 401, so
# rotating X-API-Key cannot mint fresh quota or grow metric cardinality.
keys:
  user1: { limit: 5, window: 10s }
  user2: { limit: 100, window: 1s }
